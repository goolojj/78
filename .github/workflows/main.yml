name: Build AutoPlayClient JAR (1.21.11)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Auto-Unzip & Build Fabric Mod JAR
        run: |
          BUILD_FILE=$(find . -maxdepth 4 -name 'build.gradle' | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "ZIP mila: $ZIP_FILE — unzipping..."
              mkdir -p mod_extracted
              unzip -o "$ZIP_FILE" -d mod_extracted
              BUILD_FILE=$(find mod_extracted -maxdepth 4 -name 'build.gradle' | head -n 1)
            fi
          fi
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Repo mein na build.gradle mila na koi .zip file!"
            ls -la
            exit 1
          fi
          echo "Building from: $(dirname "$BUILD_FILE")"
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlayClient-1.21.11-Mod-JAR
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
